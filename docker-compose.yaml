services:
  postgres:
    image: postgres:17
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  app:
    image: link-shortener-app:latest
    depends_on:
      - postgres
    env_file:
      - .env
    ports:
      - "8080:8080" 
  nginx:
    image: link-shortener-nginx:latest
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /home/maltid/link-shortener/static:/usr/share/nginx/html/static:ro

volumes:
  pgdata: 
  