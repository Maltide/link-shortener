<!DOCTYPE html>
<html>
<head>
  <title>Link Shortener</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <style>
    body {
      background: #171718;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: 'Inter', Arial, sans-serif;
      color: #eaeaea;
    }
    .error-box {
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(-45deg, #F66175 0%, #801C29 100%);
      color: #fff;
      border-radius: 12px;
      padding: 18px 32px;
      font-size: 1.25rem;
      font-weight: bold;
      margin: 0 auto;
      margin-top: 32px;
      box-shadow: 0 2px 12px rgba(246,97,117,0.10);
      min-width: 320px;
      max-width: 90vw;
    }
    .error-icon {
      width: 28px;
      height: 28px;
      margin-right: 16px;
      flex-shrink: 0;
      display: inline-block;
    }
    .shortener-input {
      padding: 10px 16px;
      font-size: 1.25rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      margin-bottom: 16px;
      min-width: 320px;
      max-width: 90vw;
      width: auto;
      transition: width 0.2s;
      display: block;
      margin-left: auto;
      margin-right: auto;
    }
    .shortener-btn {
      padding: 10px 22px;
      font-size: 1.25rem;
      border: none;
      border-radius: 12px;
      background: linear-gradient(-45deg, #0A483B 0%, #8BB837 100%);
      color: #fff;
      font-weight: bold;
      box-shadow: 0 2px 8px rgba(10,72,59,0.10);
      cursor: pointer;
      transition: background 0.2s;
      display: block;
      margin-left: auto;
      margin-right: auto;
    }
    .shortener-btn:hover {
      background: linear-gradient(-45deg, #8BB837 0%, #0A483B 100%);
    }
    #result {
      margin-top: 22px;
      font-size: 1.35rem;
      color: #eaeaea;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .result-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.5em;
      width: 100%;
      min-width: 0;
    }
    .short-label {
      color: #fff;
      font-size: 0.65em;
      font-weight: bold;
    }
    .result-row {
      align-items: flex-end;
    }
    #result a {
      color: #fff;
      text-decoration: none;
      background: linear-gradient(-45deg, #0A483B 0%, #8BB837 100%);
      padding: 14px 32px;
      border-radius: 12px;
      font-weight: bold;
      font-size: 1.25rem;
      box-shadow: 0 2px 8px rgba(10,72,59,0.10);
      transition: background 0.2s, color 0.2s, box-shadow 0.2s;
      display: inline-block;
      margin-top: 0;
      box-sizing: border-box;
      text-align: center;
      width: auto;
      min-width: 0;
      user-select: none;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      white-space: nowrap;
      overflow-x: auto;
    }
    #result a:hover {
      background: linear-gradient(-45deg, #8BB837 0%, #0A483B 100%);
      color: #eaeaea;
      box-shadow: 0 4px 16px rgba(139,184,55,0.18);
      text-decoration: none;
    }
    .copy-btn {
      background: transparent;
      border: none;
      border-radius: 8px;
      padding: 0;
      margin-left: 8px;
      cursor: pointer;
      vertical-align: middle;
      transition: background 0.2s;
      outline: none;
      display: inline-flex;
      align-items: center;
      box-shadow: none;
    .copied-msg.visible {
      opacity: 1;
    }
    }
    .copy-btn:hover {
      background: transparent;
    }
    .copied-msg {
      color: #8BB837;
      font-size: 1.1rem;
      margin-left: 10px;
      font-weight: bold;
      vertical-align: middle;
      display: inline-block;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .copied-msg.visible {
      opacity: 1;
    }
    .short-label {
      color: #fff;
      font-size: 1.05em;
      font-weight: 700;
      line-height: 1.1;
    }
    .copy-img-green {
      /* Лёгкий зелёный фильтр */
      filter: hue-rotate(70deg) brightness(1.2) saturate(2);
    }
    .copied-msg {
      color: #8BB837;
      font-size: 1.05em;
      margin-left: 10px;
      font-weight: bold;
      vertical-align: baseline;
      display: inline-block;
      opacity: 0;
      transition: opacity 0.2s;
    }
  </style>
  <input id="linkInput" class="shortener-input" type="text" placeholder="Enter your link here" oninput="resizeInput(this)">
  <button class="shortener-btn" onclick="shorten()">Short</button>
  <div id="result"></div>
  <script>
    function resizeInput(input) {
        input.style.width = Math.max(320, input.value.length * 10) + 'px';
    }



    function shorten() {
      const url = document.getElementById('linkInput').value;
      fetch('/short', {
        method: 'POST',
        headers: {'Content-Type': 'application/x-www-form-urlencoded'},
        body: 'url=' + encodeURIComponent(url)
      })
      .then(res => res.text().then(text => ({status: res.status, text})))
      .then(({status, text}) => {
        if (status === 200) {
          const shortUrl = window.location.origin + '/' + text;
          document.getElementById('result').innerHTML =
            '<div class="result-row" id="short-result-row" style="padding:0 2px;">'
              + '<div style="display:flex;align-items:center;">'
                + '<b class="short-label" style="margin-left:2px;">Your short link:</b>'
              + '</div>'
              + '<div style="display:flex;align-items:center;">'
                + '<span id="copied-msg" class="copied-msg">Copied!</span>'
                + '<button class="copy-btn" onclick="copyToClipboard(\'' + shortUrl + '\')" title="Copy" aria-label="Copy">'
                  + `<svg class="copy-img-green" width="35" height="35" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="display:inline-block;vertical-align:middle;">
                      <rect x="7" y="9" width="10" height="12" rx="2" fill="#fff" stroke="#0A483B" stroke-width="2"/>
                      <rect x="3" y="3" width="10" height="12" rx="2" fill="#fff" stroke="#8BB837" stroke-width="2"/>
                    </svg>`
                + '</button>'
              + '</div>'
            + '</div>'
            + '<div style="text-align:center;width:auto;margin:0 auto;display:block;">'
            +   '<span style="display:inline-block;white-space:nowrap;width:auto;">'
            +     '<a id="short-link-anchor" href="' + shortUrl + '" target="_blank" draggable="false" style="display:inline-block;white-space:nowrap;width:auto;">' + shortUrl + '</a>'
            +   '</span>'
            + '</div>';
        } else {
          let tip = '';
          if (text !== 'This site does not allow shortening its links.' && !text.includes('timeout') && !text.includes('handshake')) {
            tip = '<div style="color:#ffe082;font-size:1.5rem;font-weight:normal;margin-top:32px;text-align:center;">'
              + 'Tip: try to use&nbsp;<b>http://your_link</b>&nbsp;or&nbsp;<b>https://your_link</b>, not just&nbsp;<b>www.google.com</b>'
              + '</div>';
          }
          document.getElementById('result').innerHTML =
            '<div class="error-box">'
            + '<span class="error-icon">'
            + '<img src="/static/Error.png" alt="!" class="error-icon" />'
            + '</span>'
              + text + '</div>'
            + tip;
        }
      });
    }

    function copyToClipboard(text) {
      navigator.clipboard.writeText(text).then(function() {
        var msg = document.getElementById('copied-msg');
        if (msg) {
          msg.classList.add('visible');
          setTimeout(function() {
            msg.classList.remove('visible');
          }, 1200);
        }
      });
    }

    // Initial resize for autofill or prefilled value
    window.onload = function() {
      resizeInput(document.getElementById('linkInput'));
    }
  </script>
</body>
</html>
