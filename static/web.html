<!DOCTYPE html>
<html>
<head>
  <title>Link Shortener</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <style>
    body {
      background: #171718;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: 'Inter', Arial, sans-serif;
      color: #eaeaea;
    }
    .error-box {
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(-45deg, #F66175 0%, #801C29 100%);
      color: #fff;
      border-radius: 12px;
      padding: 18px 32px;
      font-size: 1.25rem;
      font-weight: bold;
      margin: 0 auto;
      margin-top: 32px;
      box-shadow: 0 2px 12px rgba(246,97,117,0.10);
      min-width: 320px;
      max-width: 90vw;
    }
    .error-icon {
      width: 28px;
      height: 28px;
      margin-right: 16px;
      flex-shrink: 0;
      display: inline-block;
    }
    .shortener-input {
      padding: 10px 16px;
      font-size: 1.25rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      margin-bottom: 16px;
      min-width: 320px;
      max-width: 90vw;
      width: auto;
      transition: width 0.2s;
      display: block;
      margin-left: auto;
      margin-right: auto;
    }
